name: Test

on: [push, pull_request]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  FLIX_VERSION: 0.75.1
  # Flix colourises its diagnostics; the escape codes are noise in an Actions log.
  NO_COLOR: 1

jobs:
  # `build.sbt` compiles the Scala facade with -release:21 and the Flix compiler
  # emits Java 21 bytecode, so 21 is the floor. 25 is what the benchmarks were
  # measured on. The port reaches the JVM through generated bytecode and
  # `unsafe IO { throw ... }` interop, which is where a version difference shows up.
  test:
    name: test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt

      # Must come before the sbt steps: `build.sbt`'s flixJar task shells out to
      # `flix build-jar`, and every project below it needs that to succeed.
      - uses: ./.github/actions/setup-flix
        with:
          version: ${{ env.FLIX_VERSION }}
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # The Flix suite. `flix test` compiles src/ and test/ as ONE unit, so this
      # covers the whole implementation. Includes the depth-2 replay of all 6838
      # perft corpus positions.
      - name: Flix test suite
        run: flix test

      - name: Facade compiles
        run: sbt scalaApi/compile scalaApiDropin/compile

      # The runtime check `compile` cannot do. The Flix jar is deliberately kept
      # off every Scala compile classpath, so a broken runtime classpath type-checks
      # and then dies with NoClassDefFoundError.
      - name: End-to-end smoke test
        run: sbt 'smoke/runMain smoke'

  # `flix build-jar` has no test scope, so it bundles the @Test modules. This
  # asserts the stripped jar keeps the API and drops the tests.
  artifact:
    name: release jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: ./.github/actions/setup-flix
        with:
          version: ${{ env.FLIX_VERSION }}
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Build stripped jar
        run: sbt flixReleaseJar

      # The jar is named after the clone directory, so it is discovered, not assumed.
      - name: Assert the jar is publishable
        run: |
          set -euo pipefail
          JAR=$(ls artifact/*-release.jar)
          echo "checking $JAR"
          for c in 'Api.class' 'Api/Def$clockEncode.class' 'Api/Def$gameDecode.class'; do
            unzip -l "$JAR" | grep -qF "$c" \
              || { echo "::error::$JAR is missing $c"; exit 1; }
          done
          # Any module whose name starts with Test, not an enumerated list — an
          # enumeration silently misses a module the moment one is added, which is
          # exactly how TestClockEncoderSelf once shipped. Anchoring to the start of
          # the entry name leaves Flix's own stdlib Fs/Eff$FileTest.class alone.
          if unzip -l "$JAR" | grep -qE '(^|/| )Test'; then
            echo "::error::$JAR still contains test modules:"
            unzip -l "$JAR" | grep -E '(^|/| )Test' | head -5
            exit 1
          fi
          echo "OK: $(unzip -l "$JAR" | tail -1)"

      - uses: actions/upload-artifact@v7
        with:
          name: flix-release-jar
          path: artifact/*-release.jar
          if-no-files-found: error
